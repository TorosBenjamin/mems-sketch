name: CI

# Runs only what a change can affect (.github/scripts/changed_areas.py): the
# geometry library, the engine on top of it, the Python package on top of the
# engine, the GUI on top of everything. A change runs its own part's checks
# and those of the parts above it; a change to documentation only runs none.
# The last job, "CI", passes when everything that ran passed: it is the check
# to require before merging (skipped jobs count as passed there).
on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      geom: ${{ steps.areas.outputs.geom }}
      engine: ${{ steps.areas.outputs.engine }}
      python: ${{ steps.areas.outputs.python }}
      gui: ${{ steps.areas.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parts the change touches
        id: areas
        env:
          # Passed as data, never pasted into the script.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE...HEAD" > changed.txt
          else
            : > changed.txt  # nothing to compare with (a new branch): everything runs
          fi
          echo "Changed:"; cat changed.txt
          python3 .github/scripts/changed_areas.py < changed.txt

  lint:
    needs: changes
    if: needs.changes.outputs.gui == 'true'  # any Python change reaches the GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and format
        run: |
          python -m pip install ruff==0.16.8
          ruff check .
          ruff format --check .

  geometry-library:
    name: geometry library (C++)
    needs: changes
    if: needs.changes.outputs.geom == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build doctest-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the bindings
        run: python -m pip install nanobind numpy pytest
      - name: Open CASCADE from the cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: occt-${{ runner.os }}-${{ hashFiles('src/geom/scripts/build-occt.sh') }}
      - name: Build Open CASCADE (only when not cached)
        run: src/geom/scripts/build-occt.sh
      - name: Build and test mgeom
        run: |
          cmake -S src/geom -B build/geom -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps/occt-8_0_1" \
            -DMGEOM_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
          cmake --build build/geom
          ctest --test-dir build/geom --output-on-failure

  engine:
    name: engine (C++)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build doctest-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the bindings
        run: python -m pip install nanobind numpy pytest
      - name: Open CASCADE from the cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: occt-${{ runner.os }}-${{ hashFiles('src/geom/scripts/build-occt.sh') }}
      - name: Build Open CASCADE (only when not cached)
        run: src/geom/scripts/build-occt.sh
      - name: Build and test the engine
        run: |
          cmake -S src/engine -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps/occt-8_0_1" \
            -DMEMS_ENGINE_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
          cmake --build build/engine
          ctest --test-dir build/engine --output-on-failure

  test:
    name: test (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.gui == 'true'  # every change to the program reaches the GUI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for headless Qt, build tools
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ninja-build
      - name: Open CASCADE from the cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: occt-${{ runner.os }}-${{ hashFiles('src/geom/scripts/build-occt.sh') }}
      - name: Build Open CASCADE (only when not cached)
        run: src/geom/scripts/build-occt.sh
      # The package's build of the engine, kept by the C++ it is built from:
      # a change to Python alone does not compile the engine again.
      - name: The engine's build from the cache
        uses: actions/cache@v4
        with:
          path: build/python
          key: package-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/geom/**', 'src/engine/**', 'CMakeLists.txt', 'pyproject.toml') }}
      - name: Install (the package builds its engine, which makes all geometry)
        run: SKBUILD_CMAKE_DEFINE="MEMS_SKETCH_REQUIRE_GEOMETRY=ON" pip install -e ".[dev]"
      - name: Tests (the GUI's alone when only the GUI changed)
        env:
          QT_QPA_PLATFORM: offscreen
          MGEOM_REQUIRED: "1"
          ONLY_GUI: ${{ needs.changes.outputs.python != 'true' }}
        run: |
          if [ "$ONLY_GUI" = "true" ]; then
            pytest -q tests/test_gui_*.py tests/test_architecture.py tests/test_selftest.py
          else
            pytest -q
          fi
      - name: Design-rule check of the example project
        if: needs.changes.outputs.python == 'true'
        run: mems-sketch-cli check examples/resonator

  ci:
    name: CI
    needs: [changes, lint, geometry-library, engine, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A job failed or was cancelled."
              exit 1
            fi
          done
