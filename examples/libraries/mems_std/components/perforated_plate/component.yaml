description: Square plate with a grid of release holes, round or rounded squares
parameters:
  size: {default: 160, min: 10, description: Edge length (µm)}
  pitch: {default: 20, min: 2, description: Hole pitch (µm)}
  hole:
    default: pitch / 3
    min: 0.5
    max: pitch
    description: Hole size (µm), follows the pitch
  corner_radius:
    default: hole / 2
    min: 0
    description: 'Corner radius of the holes (µm): 0 square, half the size round'
  margin:
    default: (pitch - hole) / 2
    internal: true
    description: From the plate's edge to the holes (µm)
shapes:
  plate:
    kind: rect
    layer: device
    x0: -size/2
    y0: -size/2
    x1: size/2
    y1: size/2
    modifiers:
    - kind: perforate
      pitch: pitch
      hole_size: hole
      corner_radius: corner_radius
      margin: margin
