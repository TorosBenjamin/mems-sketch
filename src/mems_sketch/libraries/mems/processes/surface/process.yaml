description: >-
  An example single-layer surface-micromachining process: one released
  structural layer over a sacrificial oxide, its anchors, and metal. Typical,
  round values, not any foundry's rules.
constants: {undercut: 2, min_gap: 2}
layers:
  device: {gds: [1, 0]}
  anchor: {gds: [2, 0]}
  metal: {gds: [3, 0]}
levels:
- layer: device
  roles: {anchor: anchor}
- {layer: metal}
rules:
  device_min_width: {kind: min_width, layers: [device], value: 2}
  device_min_space: {kind: min_space, layers: [device], value: 2}
  device_anchored: {kind: anchored, layers: [device, anchor], severity: warning}
  device_release:
    kind: release
    layers: [device, anchor]
    undercut: process.undercut
    severity: warning
