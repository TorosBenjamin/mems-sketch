name: Close issues

# GitHub closes the issues a pull request names ("closes #12") only when it
# merges into the default branch, main. Work merges into development, so this
# closes them then, with a comment linking the pull request.
on:
  pull_request:
    types: [closed]
    branches: [development]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the pull request names
        uses: actions/github-script@v7
        with:
          # The title and body are read as data by the script, never pasted into it.
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body ?? ""}`;
            const repo = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            // GitHub's keywords: close(s/d), fix(es/ed), resolve(s/d), then #N
            // or owner/repo#N (only this repository's), with an optional colon.
            const pattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+(?:([\w.-]+\/[\w.-]+))?#(\d+)\b/gi;
            const numbers = new Set();
            for (const [, other, number] of text.matchAll(pattern)) {
              if (!other || other.toLowerCase() === repo) numbers.add(Number(number));
            }
            for (const number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
              if (issue.pull_request || issue.state === "closed") continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: `Fixed by #${pr.number}, merged into \`development\`.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${number}.`);
            }
            if (numbers.size === 0) core.info("The pull request names no issues to close.");
