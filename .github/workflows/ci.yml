name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (including the backend/GUI separation check)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Design-rule check of the example project
        run: mems-sketch-cli check examples/resonator

  geometry-library:
    name: geometry library (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build doctest-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for the bindings
        run: python -m pip install nanobind numpy pytest
      - name: Open CASCADE from the cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: occt-${{ runner.os }}-${{ hashFiles('src/geom/scripts/build-occt.sh') }}
      - name: Build Open CASCADE (only when not cached)
        run: src/geom/scripts/build-occt.sh
      - name: Build and test mgeom
        run: |
          cmake -S src/geom -B build/geom -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps/occt-8_0_1" \
            -DMGEOM_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
          cmake --build build/geom
          ctest --test-dir build/geom --output-on-failure
      - name: The package with its geometry module, and layouts written from it
        run: |
          SKBUILD_CMAKE_DEFINE="MEMS_SKETCH_REQUIRE_GEOMETRY=ON" python -m pip install -e .
          python -c "from mems_sketch import _geom; print('mems_sketch._geom', _geom.__version__)"
          MGEOM_REQUIRED=1 python -m pytest -q tests/test_cells_export.py
