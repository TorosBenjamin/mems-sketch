description: >-
  Interdigitated comb: a fixed comb (bottom spine) and a moving comb (top
  spine), centred on the finger overlap. A voltage pulls the moving comb in
  along -y with a force of about n ε₀ t V² / gap (n moving fingers, t the
  thickness), the same at any overlap. The fixed spine sits on an anchor along
  its length (`anchored`; 0 for none); the moving spine is narrow enough to
  release and attaches to what it moves. Points: moving and fixed, the middle
  of each spine's outer edge. Port: drive, the fixed comb's connection.
tags: [electrode, comb drive, actuator, capacitive, resonator]
parameters:
  fingers: {default: 10, min: 1, integer: true, description: Moving fingers}
  finger_width: {default: 2, min: 0, min_exclusive: true, description: Finger width (µm)}
  finger_length: {default: 40, min: 0, min_exclusive: true, description: Finger length (µm)}
  gap: {default: 2, min: 0, min_exclusive: true, description: Lateral finger gap (µm)}
  overlap:
    default: 20
    min: 0
    max: finger_length
    max_exclusive: true
    description: "Initial finger overlap: the travel towards the fixed comb is the rest of the finger length (µm)"
  spine_width: {default: 10, min: 0, min_exclusive: true, description: Fixed spine width (µm)}
  moving_spine_width: {default: 4, min: 0, min_exclusive: true, description: "Moving spine width: narrow enough for the etch to release it (µm)"}
  anchored: {default: 1, min: 0, max: 1, integer: true, description: "1: the fixed spine on an anchor along its length; 0: no anchor"}
  enclosure:
    default: 2
    min: 0
    max: spine_width / 2
    max_exclusive: true
    description: Fixed spine around its anchor (µm)
  pitch: {default: 2 * (finger_width + gap), internal: true}
  total:
    default: (fingers + 1) * finger_width + fingers * finger_width + 2 * fingers * gap
    internal: true
    description: Width of the spines (µm); the fixed comb has one finger more
  x_start: {default: -total / 2, internal: true}
points:
  moving: {y: -overlap/2 + finger_length + moving_spine_width}
  fixed: {y: overlap/2 - finger_length - spine_width}
ports:
  drive:
    at: fixed_spine.bottom
    direction: down
    width: spine_width
    description: The fixed comb's connection, off the middle of its spine
shapes:
  fixed_fingers:
    kind: rect
    x0: x_start
    y0: overlap/2 - finger_length
    x1: x_start + finger_width
    y1: overlap/2
    modifiers:
    - {kind: array, columns: fingers + 1, dx: pitch}
  moving_fingers:
    kind: rect
    x0: x_start + finger_width + gap
    y0: -overlap/2
    x1: x_start + 2 * finger_width + gap
    y1: -overlap/2 + finger_length
    modifiers:
    - {kind: array, columns: fingers, dx: pitch}
  fixed_spine:
    kind: rect
    x0: x_start
    y0: overlap/2 - finger_length - spine_width
    x1: x_start + total
    y1: overlap/2 - finger_length
  fixed_anchor:
    kind: rect
    layer: level.anchor
    x0: (x_start + enclosure) * anchored
    y0: (overlap/2 - finger_length - spine_width + enclosure) * anchored
    x1: (x_start + total - enclosure) * anchored
    y1: (overlap/2 - finger_length - enclosure) * anchored
  moving_spine:
    kind: rect
    x0: x_start
    y0: -overlap/2 + finger_length
    x1: x_start + total
    y1: -overlap/2 + finger_length + moving_spine_width
