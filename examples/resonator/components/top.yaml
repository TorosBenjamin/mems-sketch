name: top
description: Comb-driven resonator
parameters:
- name: plate
  default: 160
- name: pitch
  default: 20
- name: w_finger
  default: process.min_gap
shapes:
- kind: ref
  name: mass
  component: std.perforated_plate
  params:
    size: plate
    pitch: pitch
- kind: ref
  name: comb_top
  component: comb_drive
  params:
    fingers: 16
    finger_width: w_finger
    gap: w_finger
  rotation: 180
  align:
    point: moving
    to: mass.top
    dy: -1
- kind: ref
  name: comb_bottom
  component: comb_drive
  params:
    fingers: 16
    finger_width: w_finger
    gap: w_finger
  align:
    point: moving
    to: mass.bottom
    dy: 1
- kind: ref
  name: suspension_left
  component: suspension
  align:
    point: right
    to: mass.left
    dx: 1.5
- kind: ref
  name: suspension_right
  component: suspension
  align:
    point: left
    to: mass.right
    dx: -1.5
