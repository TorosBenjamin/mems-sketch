description: >-
  Bond or probe pad that stays put at release: a square pad on the component's
  level held to the substrate by an anchor opening (`level.anchor`) inset by
  `enclosure`, with an opening on the level above (metal on the pad) inset by
  `margin`; set `opening` to 0 for a pad without one. Unlike `std.bond_pad`,
  the release etch does not free it. Place it on the level under the metal
  (`poly2` in `mems.polysilicon`): the opening is on the level above. Port:
  signal, on its right edge.
tags: [pad, bond pad, probe, wire bond, contact, anchor, anchored]
parameters:
  size: {default: 100, min: 2 * margin, min_exclusive: true, description: Pad edge length (µm)}
  margin: {default: 8, min: 0, description: Pad around the opening on the level above (µm)}
  enclosure:
    default: 2
    min: 0
    max: size / 2
    max_exclusive: true
    description: Overlap of the pad around its anchor (µm)
  opening: {default: 1, min: 0, max: 1, integer: true, description: "1: an opening on the level above; 0: none"}
ports:
  signal:
    at: pad.right
    direction: right
    width: size / 4
    description: Where a wire leaves the pad; turn the pad to leave another side
shapes:
  pad: {ref: anchor, size: size, enclosure: enclosure}
  pad_opening:
    kind: rect
    layer: level+1
    x0: -(size/2 - margin) * opening
    y0: -(size/2 - margin) * opening
    x1: (size/2 - margin) * opening
    y1: (size/2 - margin) * opening
