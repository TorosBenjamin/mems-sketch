name: Release source

# A pull request into main is a release (release.yml makes it when the pull
# request is merged). It must come from this repository's development
# branch, and pyproject.toml must name a version that has not been released.
on:
  pull_request:
    branches: [main]

jobs:
  from-development:
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from development
        env:
          # Passed as data, never pasted into the script: branch names are not trusted.
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_BRANCH" != "development" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests into main must come from $THIS_REPO:development, not $HEAD_REPO:$HEAD_BRANCH."
            exit 1
          fi
          echo "From $THIS_REPO:development."

  new-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version in pyproject.toml is not released yet
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Version $version is already released (tag v$version). Set a new version in pyproject.toml, through a pull request into development."
            exit 1
          fi
          echo "Releases version $version."
