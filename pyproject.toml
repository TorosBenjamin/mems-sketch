[project]
name = "mems-sketch"
version = "0.1.0"
description = "Parametric MEMS layout design: components, rule checks and pluggable export."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",  # the geometry library's outlines and snapped polygons are arrays
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
# PySide6 6.12.0 has a refcount bug that aborts Python 3.11 ("deallocating None").
gui = ["PySide6>=6.6,!=6.12.0"]
matlab = ["scipy>=1.10"]  # .mat files
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff==0.16.8", "PySide6>=6.6,!=6.12.0", "scipy>=1.10"]  # ruff pinned: CI and local agree

[project.scripts]
mems-sketch-cli = "mems_sketch.cli:main"

[project.gui-scripts]
mems-sketch = "mems_sketch.gui.app:main"

# Exporters are discovered through this entry-point group, so a separate
# package can add a format without touching this repository.
[project.entry-points."mems_sketch.exporters"]
gds = "mems_sketch.export.layout_formats:GdsExporter"
oasis = "mems_sketch.export.layout_formats:OasisExporter"
dxf = "mems_sketch.export.layout_formats:DxfExporter"
json = "mems_sketch.export.document_formats:JsonExporter"
xml = "mems_sketch.export.document_formats:XmlExporter"
mat = "mems_sketch.export.document_formats:MatExporter"

# scikit-build-core builds the geometry library's Python module (C++, see
# CMakeLists.txt) into the package when Open CASCADE is found; without it the
# package is pure Python.
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
cmake.build-type = "Release"
build-dir = "build/python/{wheel_tag}"  # kept, so a rebuild only compiles what changed
wheel.packages = ["src/mems_sketch"]
sdist.exclude = ["build/", ".github/", "docs/images/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
